<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Studio — Tạo ảnh AI</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/image-studio.css">
</head>
<body>
<div class="studio-wrap">
  <header class="studio-header">
    <h1>🎨 Image Studio</h1>
    <p class="studio-subtitle">Tạo ảnh bằng AI — Gemini Imagen 3 (Primary) tự động chuyển sang OpenAI DALL-E 3 (Fallback) khi cần.</p>
  </header>

  <main class="studio-main">
    <form id="image-form" class="studio-form">
      <label for="prompt-input">Mô tả hình ảnh</label>
      <textarea id="prompt-input" name="prompt" rows="4" placeholder="Ví dụ: một chú mèo phi hành gia đứng trên mặt trăng, phía sau là Trái Đất..." required></textarea>

      <label for="negative-prompt-input">Loại trừ (không bắt buộc)</label>
      <input type="text" id="negative-prompt-input" name="negativePrompt" placeholder="Ví dụ: mờ, biến dạng, chữ viết sai">

      <div class="studio-form-row">
        <div class="studio-field">
          <label for="aspect-ratio-select">Tỉ lệ khung hình</label>
          <select id="aspect-ratio-select" name="aspectRatio">
            <option value="1:1">Vuông (1:1)</option>
            <option value="16:9">Ngang (16:9)</option>
            <option value="9:16">Dọc (9:16)</option>
          </select>
        </div>

        <div class="studio-field">
          <label for="style-select">Phong cách</label>
          <select id="style-select" name="style">
            <option value="">Mặc định (không thêm phong cách)</option>
            <option value="photorealistic">Ảnh thực (Photorealistic)</option>
            <option value="anime">Anime</option>
            <option value="3d-render">3D Render</option>
            <option value="cinematic">Điện ảnh (Cinematic)</option>
            <option value="cyberpunk">Cyberpunk</option>
          </select>
        </div>
      </div>

      <button type="submit" id="generate-btn" class="studio-generate-btn">
        <span class="btn-label">Tạo ảnh</span>
      </button>
    </form>

    <section class="studio-preview" id="preview-section" aria-live="polite">
      <div id="loading-skeleton" class="loading-skeleton" hidden>
        <div class="pulse-block"></div>
        <p class="loading-text">Đang tạo ảnh, vui lòng đợi...</p>
      </div>

      <div id="result-container" class="result-container" hidden>
        <img id="result-image" class="result-image" alt="Ảnh do AI tạo">
        <div class="result-meta">
          <span id="result-provider" class="result-provider-badge"></span>
          <button type="button" id="download-btn" class="studio-download-btn">⬇ Tải ảnh xuống</button>
        </div>
      </div>

      <div id="empty-state" class="empty-state">
        <p>Ảnh của bạn sẽ hiện ở đây sau khi tạo.</p>
      </div>
    </section>
  </main>
</div>

<script src="/js/image-studio.js"></script>
</body>
</html>
